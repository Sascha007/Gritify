<!DOCTYPE html>
<html>
<head>
    <title>Wireframe Test</title>
</head>
<body>
    <h1>Wireframe Button Test</h1>
    <button id="wireframe-toggle">🔲 Wireframe View</button>
    <div id="output"></div>
    
    <script>
        // Simulate the wireframe toggle functionality
        let wireframeMode = false;
        const WIREFRAME_BUTTON_TEXT = {
            solid: '🔲 Wireframe View',
            wireframe: '🔲 Solid View'
        };
        
        function toggleWireframe() {
            wireframeMode = !wireframeMode;
            const button = document.getElementById('wireframe-toggle');
            const output = document.getElementById('output');
            
            button.textContent = wireframeMode ? WIREFRAME_BUTTON_TEXT.wireframe : WIREFRAME_BUTTON_TEXT.solid;
            
            if (wireframeMode) {
                output.innerHTML = '<p style="color: green;">✓ Wireframe mode activated!</p><p>Surface edges will be shown with transparent surfaces to distinguish from open areas.</p>';
            } else {
                output.innerHTML = '<p style="color: blue;">✓ Solid mode activated!</p><p>Model shown with solid material.</p>';
            }
        }
        
        // Add event listener (THIS WAS MISSING BEFORE!)
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('wireframe-toggle').addEventListener('click', toggleWireframe);
            console.log('Event listener attached successfully!');
        });
    </script>
</body>
</html>
